<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>calculadora de alleggs</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="calculator">
            <button class="btn-toggle-history" id="btn-historial" title="Ver Historial">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
                    <circle cx="12" cy="12" r="9.5" />
                    <path d="M12 7v5.2l3.3 2" />
                </svg>
            </button>
            <div class="panel-historial-flotante" id="panel-historial">
                <div class="titulo-historial">
                    <span>Historial de Operaciones</span>
                    <button class="btn-borrar-historial" id="btn-borrar-historial" title="Borrar historial">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <line x1="10" y1="11" x2="10" y2="17"></line>
                            <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                    </button>
                </div>
                <div class="lista-operaciones"></div>
            </div>
            <button class="btn-extra" id="btn-extra" title="Más opciones">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
                    <circle cx="5" cy="12" r="1.5" />
                    <circle cx="12" cy="12" r="1.5" />
                    <circle cx="19" cy="12" r="1.5" />
                </svg>
            </button>

            <div class="panel-extra-flotante" id="panel-extra">
                <button class="extra-opcion" data-opcion="cientifica">
                    <span>Modo científico</span>
                </button>
                <button class="extra-opcion" data-opcion="tema">
                    <span>Cambiar tema</span>
                </button>
            </div>

            <div class="display-container">
                <div class="operation-history"></div>
                <div class="display">0</div>
            </div>

            <div class="fila-cientifica" id="fila-cientifica">
                <button class="btn-cientifico" data-func="paren-open">(</button>
                <button class="btn-cientifico" data-func="paren-close">)</button>
                <button class="btn-cientifico" data-func="sqrt">√</button>
                <button class="btn-cientifico" data-func="pow">xʸ</button>
                <button class="btn-cientifico" data-func="e">e</button>
                <button class="btn-cientifico" data-func="pi">π</button>
            </div>

            <div class="buttons-grid">
                <button class="btn-top-op btn-backspace">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0 -2-2z" />
                        <line x1="12" y1="9" x2="16" y2="13" />
                        <line x1="16" y1="9" x2="12" y2="13" />
                    </svg>
                </button>
                <button class="btn-top-op" id="btn-clear">AC</button>
                <button class="btn-top-op">%</button>
                <button class="btn-right-op">÷</button>

                <button class="btn-number">7</button>
                <button class="btn-number">8</button>
                <button class="btn-number">9</button>
                <button class="btn-right-op">×</button>

                <button class="btn-number">4</button>
                <button class="btn-number">5</button>
                <button class="btn-number">6</button>
                <button class="btn-right-op">−</button>

                <button class="btn-number">1</button>
                <button class="btn-number">2</button>
                <button class="btn-number">3</button>
                <button class="btn-right-op">+</button>

                <button class="btn-number btn-plus-minus">
                    <span class="sign-plus">+</span>
                    <span class="sign-minus">−</span>
                </button>
                <button class="btn-number btn-zero">0</button>
                <button class="btn-number">.</button>
                <button class="btn-right-op">=</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
